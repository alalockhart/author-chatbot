<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Bona+Nova:ital,wght@0,400;0,700;1,400;1,700&family=Mona+Sans:ital,wght@0,200..900;1,200..900&family=Viaoda+Libre&display=swap" rel="stylesheet">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <title>Author Chatbot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #F3ECDC;
      font-family: "Bona Nova", Georgia, serif;
    }

    /* Chat button */
#chat-button {
  position: fixed;
  right: 24px;
  bottom: 24px;

  width: 62px;
  height: 62px;

  border: 1px solid rgba(148, 102, 50, 0.8);
  border-radius: 50%;

  background: #7E2625;
  color: #F3ECDC;

  font-family: "Viaoda Libre", Georgia, serif;

  cursor: pointer;

  box-shadow:
    0 8px 25px rgba(63, 48, 40, 0.20),
    inset 0 0 0 1px rgba(243, 236, 220, 0.12);

  z-index: 9999;

  transition:
    transform 0.35s ease,
    box-shadow 0.35s ease,
    background 0.35s ease;

  animation: buttonBreath 4s ease-in-out infinite;
}
    #chat-button iconify-icon {
  font-size: 28px;
  vertical-align: middle;
}

#chat-button::before {
  content: "";

  position: absolute;
  inset: 5px;

  border: 1px solid rgba(148, 102, 50, 0.65);
  border-radius: 50%;

  pointer-events: none;
}

#chat-button:hover {
  transform: translateY(-3px) rotate(3deg);

  background: #8A2A29;

  box-shadow:
    0 12px 30px rgba(63, 48, 40, 0.24),
    0 0 0 4px rgba(148, 102, 50, 0.10);
}

#chat-button:active {
  transform: translateY(0) scale(0.96);
}

@keyframes buttonBreath {
  0%,
  100% {
    box-shadow:
      0 8px 25px rgba(63, 48, 40, 0.20),
      inset 0 0 0 1px rgba(243, 236, 220, 0.12);
  }

  50% {
    box-shadow:
      0 10px 28px rgba(63, 48, 40, 0.23),
      0 0 0 5px rgba(148, 102, 50, 0.06),
      inset 0 0 0 1px rgba(243, 236, 220, 0.12);
  }
}
    
/* Chat window */
#chat-window {
  display: none;

  position: fixed;
  right: 24px;
  bottom: 96px;

  width: 380px;
  max-width: calc(100vw - 32px);
  height: 540px;
  max-height: calc(100vh - 120px);

  background: #F3ECDC;

  border: 1px solid rgba(148, 102, 50, 0.55);
  border-radius: 22px;

  overflow: hidden;

  box-shadow:
    0 20px 60px rgba(63, 48, 40, 0.18),
    0 4px 14px rgba(63, 48, 40, 0.10);

  z-index: 9998;

  transform-origin: bottom right;
}

    #chat-window.chat-opening {
  animation: chatOpen 0.38s cubic-bezier(0.22, 1, 0.36, 1);
}

@keyframes chatOpen {
  from {
    opacity: 0;
    transform: translateY(14px) scale(0.97);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* Header */
#chat-header {
  position: relative;

  padding: 22px 24px 20px;

  background: #7E2625;
  color: #F3ECDC;

  border-bottom: 1px solid rgba(148, 102, 50, 0.6);
}

#chat-header h2 {
  margin: 0;

  font-family: "Viaoda Libre", Georgia, serif;
  font-weight: normal;

  font-size: 24px;
  line-height: 1.2;
  letter-spacing: 0.01em;
}

#chat-header p {
  margin: 7px 0 0;

  font-family: "Mona Sans", sans-serif;

  font-size: 13px;
  line-height: 1.5;

  letter-spacing: 0.01em;
  opacity: 0.88;
}
    .header-icon {
  position: absolute;
  right: 22px;
  top: 18px;

  font-size: 18px;
  color: #946632;

  opacity: 0.9;
}

    /* Messages */
    #messages {
      height: calc(100% - 135px);
      padding: 20px;
      overflow-y: auto;
    }

    .message {
  margin-bottom: 14px;
  line-height: 1.6;
  font-size: 14px;
  max-width: 88%;
  animation: messageAppear 0.35s ease;
}

@keyframes messageAppear {
  from {
    opacity: 0;
    transform: translateY(5px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

    .bot {
  color: #3f3028;

  background: rgba(255, 255, 255, 0.55);

  border: 1px solid rgba(148, 102, 50, 0.18);
  border-radius: 4px 16px 16px 16px;

  padding: 12px 15px;

  box-shadow:
    0 4px 12px rgba(63, 48, 40, 0.05);
}

    .user {
  margin-left: auto;

  text-align: right;
  color: #F3ECDC;

  background: #7E2625;

  border-radius: 16px 4px 16px 16px;

  padding: 10px 14px;

  box-shadow:
    0 4px 12px rgba(126, 38, 37, 0.12);
}

    /* Input */
    #input-area {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;

      display: flex;
      gap: 8px;

      padding: 12px;

      background: #F3ECDC;
      border-top: 1px solid rgba(148,102,50,0.35);
    }

#user-input {
  flex: 1;

  border: 1px solid #946632;
  border-radius: 20px;

  padding: 10px 14px;

  background: white;
  outline: none;

  font-family: "Mona Sans", sans-serif;
}

#send-button {
  border: none;
  border-radius: 20px;

  padding: 0 16px;

  background: #7E2625;
  color: #F3ECDC;

  cursor: pointer;

  font-family: "Mona Sans", sans-serif;
  font-size: 13px;
  font-weight: 500;
}

    @media (max-width: 500px) {

      #chat-window {
        right: 12px;
        bottom: 84px;

        width: calc(100vw - 24px);
        height: calc(100vh - 110px);
      }

      #chat-button {
        right: 16px;
        bottom: 16px;
      }
    }
  </style>
</head>

<body>

<button id="chat-button" aria-label="Open chat">
  <iconify-icon icon="ri:book-ai-fill"></iconify-icon>
</button>

<div id="chat-window">

  <div id="chat-header">
    <h2>A little something for you</h2>
    <p>Have a question? I'm here to help.</p>

    <iconify-icon
      icon="ri:book-ai-fill"
      class="header-icon">
    </iconify-icon>
  </div>

  <div id="messages">
    <div class="message bot">
      Hello, curious reader. What can I help you find?
    </div>
  </div>

    <div id="input-area">
      <input
        id="user-input"
        type="text"
        placeholder="Ask a question..."
        autocomplete="off"
      >

      <button id="send-button">
        Send
      </button>
    </div>

  </div>

  <script>

    const chatButton = document.getElementById("chat-button");
    const chatWindow = document.getElementById("chat-window");
    const input = document.getElementById("user-input");
    const sendButton = document.getElementById("send-button");
    const messages = document.getElementById("messages");

    chatButton.addEventListener("click", function() {

  if (chatWindow.style.display === "block") {
    chatWindow.style.display = "none";
  } else {
    chatWindow.style.display = "block";

    chatWindow.classList.remove("chat-opening");

    void chatWindow.offsetWidth;

    chatWindow.classList.add("chat-opening");

    input.focus();
  }

});

    function addMessage(text, type) {

      const message = document.createElement("div");

      message.className = "message " + type;

      message.textContent = text;

      messages.appendChild(message);

      messages.scrollTop = messages.scrollHeight;
    }

async function sendMessage() {

  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");

  input.value = "";

  // Show temporary loading message
  addMessage("Let me think...", "bot");

  try {

    const response = await fetch("https://author-chatbot-eight.vercel.app/api/chat", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: text
      })

    });

    const data = await response.json();

    // Remove the loading message
    const loadingMessage = messages.lastElementChild;

    if (
      loadingMessage &&
      loadingMessage.textContent === "Let me think..."
    ) {
      loadingMessage.remove();
    }

    if (!response.ok) {
      throw new Error(data.error || "Something went wrong.");
    }

    addMessage(data.reply, "bot");

  } catch (error) {

    console.error(error);

    const loadingMessage = messages.lastElementChild;

    if (
      loadingMessage &&
      loadingMessage.textContent === "Let me think..."
    ) {
      loadingMessage.remove();
    }

addMessage(
  "Error: " + error.message,
  "bot"
);

  }
}

    sendButton.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    });

  </script>

</body>
</html>
