<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Bona+Nova:ital,wght@0,400;0,700;1,400;1,700&family=Mona+Sans:ital,wght@0,200..900;1,200..900&family=Viaoda+Libre&display=swap" rel="stylesheet">

  <title>Author Chatbot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #F3ECDC;
      font-family: "Bona Nova", Georgia, serif;
    }

    /* Chat button */
    #chat-button {
      position: fixed;
      right: 24px;
      bottom: 24px;

      width: 60px;
      height: 60px;

      border: none;
      border-radius: 50%;

      background: #7E2625;
      color: #F3ECDC;

      font-size: 24px;
      cursor: pointer;

      box-shadow: 0 5px 20px rgba(0,0,0,0.18);

      z-index: 9999;
    }

/* Chat window */
#chat-window {
  display: none;

  position: fixed;
  right: 24px;
  bottom: 96px;

  width: 380px;
  max-width: calc(100vw - 32px);
  height: 540px;
  max-height: calc(100vh - 120px);

  background: #F3ECDC;

  border: 1px solid rgba(148, 102, 50, 0.55);
  border-radius: 22px;

  overflow: hidden;

  box-shadow:
    0 20px 60px rgba(63, 48, 40, 0.18),
    0 4px 14px rgba(63, 48, 40, 0.10);

  z-index: 9998;

  transform-origin: bottom right;
}

/* Header */
#chat-header {
  position: relative;

  padding: 22px 24px 20px;

  background: #7E2625;
  color: #F3ECDC;

  border-bottom: 1px solid rgba(148, 102, 50, 0.6);
}

#chat-header::after {
  content: "✦";

  position: absolute;
  right: 22px;
  top: 18px;

  font-size: 16px;
  color: #946632;

  opacity: 0.9;
}

#chat-header h2 {
  margin: 0;

  font-family: "Viaoda Libre", Georgia, serif;
  font-weight: normal;

  font-size: 24px;
  line-height: 1.2;
  letter-spacing: 0.01em;
}

#chat-header p {
  margin: 7px 0 0;

  font-family: "Mona Sans", sans-serif;

  font-size: 13px;
  line-height: 1.5;

  letter-spacing: 0.01em;
  opacity: 0.88;
}

    /* Messages */
    #messages {
      height: calc(100% - 135px);
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 14px;
      line-height: 1.5;
      font-size: 14px;
    }

    .bot {
      color: #3f3028;
    }

    .user {
      text-align: right;
      color: #7E2625;
    }

    /* Input */
    #input-area {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;

      display: flex;
      gap: 8px;

      padding: 12px;

      background: #F3ECDC;
      border-top: 1px solid rgba(148,102,50,0.35);
    }

#user-input {
  flex: 1;

  border: 1px solid #946632;
  border-radius: 20px;

  padding: 10px 14px;

  background: white;
  outline: none;

  font-family: "Mona Sans", sans-serif;
}

#send-button {
  border: none;
  border-radius: 20px;

  padding: 0 16px;

  background: #7E2625;
  color: #F3ECDC;

  cursor: pointer;

  font-family: "Mona Sans", sans-serif;
  font-size: 13px;
  font-weight: 500;
}

    @media (max-width: 500px) {

      #chat-window {
        right: 12px;
        bottom: 84px;

        width: calc(100vw - 24px);
        height: calc(100vh - 110px);
      }

      #chat-button {
        right: 16px;
        bottom: 16px;
      }
    }
  </style>
</head>

<body>

  <button id="chat-button" aria-label="Open chat">
    ✦
  </button>

  <div id="chat-window">

    <div id="chat-header">
      <h2>A little something for you</h2>
      <p>Have a question? I'm here to help.</p>
    </div>

    <div id="messages">
      <div class="message bot">
        Hello, curious reader. What can I help you find?
      </div>
    </div>

    <div id="input-area">
      <input
        id="user-input"
        type="text"
        placeholder="Ask a question..."
        autocomplete="off"
      >

      <button id="send-button">
        Send
      </button>
    </div>

  </div>

  <script>

    const chatButton = document.getElementById("chat-button");
    const chatWindow = document.getElementById("chat-window");
    const input = document.getElementById("user-input");
    const sendButton = document.getElementById("send-button");
    const messages = document.getElementById("messages");

    chatButton.addEventListener("click", function() {

      if (chatWindow.style.display === "block") {
        chatWindow.style.display = "none";
      } else {
        chatWindow.style.display = "block";
        input.focus();
      }

    });

    function addMessage(text, type) {

      const message = document.createElement("div");

      message.className = "message " + type;

      message.textContent = text;

      messages.appendChild(message);

      messages.scrollTop = messages.scrollHeight;
    }

async function sendMessage() {

  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");

  input.value = "";

  // Show temporary loading message
  addMessage("Let me think...", "bot");

  try {

    const response = await fetch("https://author-chatbot-eight.vercel.app/api/chat", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: text
      })

    });

    const data = await response.json();

    // Remove the loading message
    const loadingMessage = messages.lastElementChild;

    if (
      loadingMessage &&
      loadingMessage.textContent === "Let me think..."
    ) {
      loadingMessage.remove();
    }

    if (!response.ok) {
      throw new Error(data.error || "Something went wrong.");
    }

    addMessage(data.reply, "bot");

  } catch (error) {

    console.error(error);

    const loadingMessage = messages.lastElementChild;

    if (
      loadingMessage &&
      loadingMessage.textContent === "Let me think..."
    ) {
      loadingMessage.remove();
    }

addMessage(
  "Error: " + error.message,
  "bot"
);

  }
}

    sendButton.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    });

  </script>

</body>
</html>
